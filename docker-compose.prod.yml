version: '3.8'

# Production stack chạy trên VPS Ubuntu 24.04
# Không mount source code vào container — image đã bake code sẵn.
# Redeploy = `git pull` + `docker compose build` + `docker compose up -d`.
# 
# ⚠️ LƯU Ý: Celery đã được thay thế bằng FastAPI native BackgroundTasks (Phase 3)
# Redis vẫn còn cho các chức năng cache (có thể loại bỏ sau nếu không cần)

services:
  # ─── Reverse Proxy (auto HTTPS) ───
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - appnet

  # ─── FastAPI Backend (với native BackgroundTasks - thay thế Celery) ───
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "8000"
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
    networks:
      - appnet

  # ─── Next.js Frontend (BFF pattern - gọi API qua Docker network nội bộ) ───
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - appnet

  # ─── Redis (cache, rate limit - giữ lại cho middleware) ───
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - appnet

  # ─── OmniVoice Voice Studio (standalone service) ───
  omnivoice:
    build:
      context: apps/omnivoice
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "8088"
    volumes:
      - ./apps/omnivoice/voices:/app/voices
      - ./apps/omnivoice/voice_registry.json:/app/voice_registry.json
    networks:
      - appnet

volumes:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  appnet:
    driver: bridge