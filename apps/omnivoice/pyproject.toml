[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnivoice-api-server"
version = "1.1.0"
description = "Offline FastAPI wrapper for k2-fsa/OmniVoice text-to-speech (v0.2.0 pinned)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "OmniVoice Local Server Maintainers" },
]
keywords = ["tts", "omnivoice", "fastapi", "voice-clone", "text-to-speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Runtime dependencies (kept in sync with requirements.txt for pip -r compat).
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "soundfile>=0.12.0",
    "numpy>=1.20.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "omnivoice @ git+https://github.com/k2-fsa/OmniVoice.git@0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "types-requests>=2.31.0",
]

[project.urls]
"Source" = "https://github.com/k2-fsa/OmniVoice"
"Bug Reports" = "https://github.com/k2-fsa/OmniVoice/issues"

# ────────────────────────────────────────────────────────────────────
# Tool configuration
# ────────────────────────────────────────────────────────────────────

[tool.ruff]
# Match upstream OmniVoice style: line-length 100, double quotes, PEP 8.
line-length = 100
target-version = "py310"
extend-exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
# Pragmatic default: enable pycodestyle/pyflakes/upgrades, plus bugbear + comprehensions.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import order)
    "B",    # flake8-bugbear (common pitfalls)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (modern syntax)
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "B008",   # function call in default argument (FastAPI uses this idiom)
    "E402",   # module-level import not at top (lazy imports in lifespan)
]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]   # lazy torch/omnivoice import inside lifespan
"tests/**/*.py" = ["B011"] # assert False is fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false   # pragmatic: external OmniVoice types are untyped
ignore_missing_imports = true   # omnivoice doesn't ship type stubs
exclude = ["venv", ".venv", "build", "dist"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::PendingDeprecationWarning",
]