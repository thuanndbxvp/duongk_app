name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cho phep CI retry neu timeout khi pull model tu HuggingFace
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Lint: ruff check + format
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: pip install "ruff>=0.5.0"

      - name: Ruff check
        run: ruff check app/

      - name: Ruff format check
        run: ruff format --check app/

  # ─────────────────────────────────────────────────────────────
  # Compile: kiem tra Python syntax (catch import / type errors nhanh)
  # ─────────────────────────────────────────────────────────────
  compile:
    name: Compile (py_compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile app/main.py
        run: python -m py_compile app/main.py

  # ─────────────────────────────────────────────────────────────
  # Test: pytest voi omnivoice mock (do model that qua nang de CI)
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install runtime deps (skip omnivoice de tranh pull model)
        run: |
          pip install "fastapi>=0.100.0" "uvicorn>=0.22.0" "soundfile>=0.12.0" "numpy>=1.20.0" "python-dotenv>=1.0.0" "requests>=2.31.0"

      - name: Install dev deps
        run: |
          pip install "pytest>=7.4.0" "pytest-asyncio>=0.23.0" "httpx>=0.27.0" "ruff>=0.5.0"

      - name: Run tests
        run: |
          # Set bien gia de import main.py (no model that)
          OMNIVOICE_SKIP_LOAD=1 pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}/app